name: android-apk

on:
  workflow_dispatch:
  push:
    branches: [main, claude/fpv-mobile-game-3c611s]
    paths:
      - 'fpv-drone/**'
      - 'android-signing/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot and Android export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" ~/godot/godot
          chmod +x ~/godot/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d "$dest"
          ls -la "$dest"

      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres "editor_settings-${GODOT_VERSION}.tres"; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_SDK_ROOT" "$JAVA_HOME" > ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.tres

      - name: Import project
        run: timeout 900 ~/godot/godot --headless --path fpv-drone --editor --quit 2>&1 | tail -n 40 || true

      - name: Smoke test (plays the game and prints screenshots to the log)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 600 ~/godot/godot --path fpv-drone \
            --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1280x720 \
            -- --smoke > smoke.log 2>&1 || true
          grep -v '^SHOT' smoke.log | tail -n 150
          if grep -E "SCRIPT ERROR|Parse Error|SHADER ERROR" smoke.log; then
            echo "::error::Godot reported script or shader errors"
            exit 1
          fi
          grep -q "SMOKE OK" smoke.log

      - name: Print screenshots
        if: always()
        run: grep '^SHOT' smoke.log || true

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/android-signing/dolina-fpv.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: dolinafpv
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: dolinafpv
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/android-signing/dolina-fpv.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: dolinafpv
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: dolinafpv
        run: |
          mkdir -p build
          ~/godot/godot --headless --path fpv-drone --export-release "Android" "$GITHUB_WORKSPACE/build/DolinaFPV.apk" 2>&1 | tee export.log
          test -f build/DolinaFPV.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: DolinaFPV-apk
          path: build/DolinaFPV.apk

      - name: Publish the APK as release "fpv-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fpv-latest --yes --cleanup-tag || true
          gh release create fpv-latest build/DolinaFPV.apk --prerelease --target "$GITHUB_SHA" \
            --title "Долина FPV — свежая сборка" \
            --notes "APK для Android собран из коммита $GITHUB_SHA. Скачайте DolinaFPV.apk на телефон и установите (разрешите установку из неизвестных источников)."
