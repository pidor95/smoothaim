name: physicsbox-android
on:
  workflow_dispatch:
  push:
    paths:
      - "physicsbox/**"
      - ".github/workflows/physicsbox-android.yml"
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.5.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Godot and Android export templates
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $tpl
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz "templates/android_*" "templates/version.txt" -d $tpl
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz
      - name: Point Godot at the Android SDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Export APK
        working-directory: physicsbox
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/physicsbox/android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          # headless import occasionally hangs on exit; the export re-scans anyway
          timeout 300 ../godot --headless --import || true
          ../godot --headless --export-release "Android" build/PhysicsBox.apk
          test -f build/PhysicsBox.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PhysicsBox-apk
          path: physicsbox/build/PhysicsBox.apk
      - name: Publish to the "latest" release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Physics Box (последняя сборка)
          body: "Скачать: https://github.com/${{ github.repository }}/releases/download/latest/PhysicsBox.apk"
          make_latest: true
          files: physicsbox/build/PhysicsBox.apk
